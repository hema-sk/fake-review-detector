version: '3.8'

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: reviewguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fake_reviews

  # ── Python ML Service ──────────────────────────────────────────────────────
  ml-service:
    build: ./ml-service
    container_name: reviewguard-ml
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
    volumes:
      - ml_model:/app/model_cache

  # ── Node.js Backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: reviewguard-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/fake_reviews
      ML_SERVICE_URL: http://ml-service:5001
      FRONTEND_URL: http://localhost:4200
      NODE_ENV: production
    depends_on:
      - mongodb
      - ml-service

  # ── Angular Frontend ───────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: reviewguard-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  ml_model:
